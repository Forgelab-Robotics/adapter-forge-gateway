# Gateway node example config.
# Run with:
#   gateway --config config.example.yaml
#
# Gateway 将 Dora 中的机器人状态、动作和图像转为 HTTP/WebSocket 接口。
# 频率字段会被限制在 0.1-120 Hz，JPEG 质量范围为 1-100。

host: 127.0.0.1  # 监听地址；127.0.0.1 仅本机访问，0.0.0.0 允许局域网访问。
port: 9001       # HTTP/WebSocket 端口；需避免与其他服务冲突。

# Display/order filter for JointState and JointCommand values.
# 顺序必须与 task_robot 输出的 JointState/JointCommand 向量一致。
joint_order:
  - joint1
  - joint2
  - joint3
  - joint4
  - joint5
  - joint6
  - gripper

# Dora input ids for image streams.
# 这些 id 必须与 dataflow.yaml 中 gateway.inputs 的图像键一致。
image_input_ids:
  - image/wrist
  - image/top

state_broadcast_hz: 50    # 状态推送频率 (Hz)，默认 50，运行时限制为 0.1-120。
image_broadcast_hz: 24    # 图像推送频率 (Hz)，默认 24，运行时限制为 0.1-120。
ws_send_timeout_sec: 1.0  # WebSocket 单次发送超时 (秒)，最小 0.1。
jpeg_quality: 85          # Web 端图像 JPEG 质量，范围 1-100。
policy_id: default        # 展示/控制使用的策略标识，通常保持 default。
command_queue_capacity: 256  # 普通出站命令上限；另保留一个 safety stop 槽位。

# Gateway-owned Tool discovery and Query/Action invocation is opt-in. Public callers
# use request_input_id/response_output_id and never provide endpoint_instance_id;
# provider instances are private routing state. Each provider shares one input for
# register/unregister/invoke.response/tool.error and one output for
# registry.response/invoke.request.
tools:
  enabled: false
  lease_ttl_ms: 15000
  invoke_timeout_ms: 5000  # HTTP/Dora caller timeout 的最大值；caller 只能缩短。
  invocation_capacity: 128 # active 与 retention 中 Action invocation 的总量硬上限。
  event_capacity: 128      # 每个 Action invocation 保留的最新事件数。
  retention_sec: 300       # terminal result/event 的内存保留时间。
  request_input_id: tool_request
  response_output_id: tool_response
  providers: []
  # providers:
  #   - endpoint_id: vision.yolo
  #     input_id: yolo/to_gateway
  #     output_id: gateway/to_yolo
  specs: []
  # specs:
  #   - tool_id: robot.pick
  #     implementation_id: piper.primary
  #     endpoint_id: robot.piper
  #     operation: pick
  #     semantics: action
  #     description: Pick one object.
  #     input_schema: {}
  #     output_schema: {}
  #     readiness: [proprio_state]
  #     robot_frame_profile:
  #       robot_id: piper
  #       base_frame: base
  #       tool_frame: gripper
  #       frames: {}
  #       directions:
  #         forward: {frame: base, axis: x, sign: 1}

readiness:
  require_proprio_state: true   # true 时，收到本体状态后才允许 /runtime/start 生效。
  require_images: true          # true 时，所有 image_input_ids 都收到新图像后才允许启动。
  require_state_client: false   # true 时，必须有状态 WebSocket 客户端连接后才允许启动。
  require_image_client: false   # true 时，必须有图像 WebSocket 客户端连接后才允许启动。
  proprio_stale_after_sec: 2.0  # 本体状态超过该秒数未更新则视为未就绪；设为 null 保留 presence-only 兼容模式。
  image_stale_after_sec: 2.0    # 图像超过该秒数未更新则视为未就绪，最小 0.1。
