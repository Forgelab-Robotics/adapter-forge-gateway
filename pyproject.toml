[project]
name = "forge-gateway"
version = "1.0.0"
description = "Unified Forge runtime gateway: HTTP control API, runtime readiness gate, and WebSocket viewer"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dora-rs==0.4.1",
    "fastapi",
    "uvicorn[standard]",
    "forge-msgs>=1.0.0,<2",
    "forge-common>=1.0.0,<2",
    "opencv-python",
    "pyyaml",
]



[dependency-groups]
dev = [
    "httpx",
    "pytest",
]
build = [
    "pyinstaller",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv]
package = false

[tool.uv.sources]
forge-msgs = { git = "https://gitlab.ex-ai.cn/meta-emt/framework/forge.git", tag = "forge-msgs-v1.0.0", subdirectory = "packages/msgs" }
forge-common = { git = "https://gitlab.ex-ai.cn/meta-emt/framework/forge.git", tag = "forge-common-v1.0.0", subdirectory = "packages/common" }

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["src"]
