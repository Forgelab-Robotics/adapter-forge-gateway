[project]
name = "forge-gateway"
version = "1.0.1"
description = "Unified Forge runtime gateway: HTTP control API, runtime readiness gate, and WebSocket viewer"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "PhyAgentOS Contributors" }]
maintainers = [{ name = "PhyAgentOS Contributors" }]
keywords = ["robotics", "gateway", "dora", "forge", "websocket", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "click>=8.3.3,<9",
    "dora-rs==0.4.1",
    "fastapi>=0.141.1,<1",
    "uvicorn[standard]>=0.30,<1",
    "forge-msgs==1.0.1",
    "forge-common>=1.0.0,<2",
    "opencv-python>=4.10,<5",
    "pillow>=12.3,<13",
    "pyyaml>=6,<7",
]

[project.urls]
Homepage = "https://github.com/Forgelab-Robotics/adapter-forge-gateway"
Documentation = "https://github.com/Forgelab-Robotics/adapter-forge-gateway#readme"
Repository = "https://github.com/Forgelab-Robotics/adapter-forge-gateway.git"
Issues = "https://github.com/Forgelab-Robotics/adapter-forge-gateway/issues"

[dependency-groups]
dev = [
    "httpx",
    "pytest",
]
build = [
    "pyinstaller",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv]
package = false

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["src"]
